<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>HW 작업실</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#000;--navy:#0c1330;--gold:#F2BE48;--gold2:#FFDE8C;--text:#f3efe6;--muted:#8f93a0;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;
  background-image:radial-gradient(520px 420px at 50% 38%,rgba(242,190,72,.16),transparent 70%)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.logo{width:132px;height:132px;border-radius:32px;box-shadow:0 0 0 2px rgba(242,190,72,.55),0 18px 50px rgba(242,190,72,.28);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
h1{font-size:26px;font-weight:900;letter-spacing:-.03em;animation:up .5s .08s both}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--muted);font-size:14px;margin-top:-14px;animation:up .5s .12s both}
.bar{width:150px;height:4px;border-radius:2px;background:rgba(242,190,72,.18);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:load 1s ease-in-out infinite}
.open{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;min-height:60px;border-radius:18px;text-decoration:none;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-weight:900;font-size:19px;box-shadow:0 10px 30px rgba(242,190,72,.3);animation:up .35s both}
.open:active{transform:scale(.98)}
.msg{color:var(--muted);font-size:13.5px;text-align:center;line-height:1.6;max-width:320px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#work{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .35s}
#work.on{opacity:1}
.float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:7px 11px;border-radius:12px;font-size:12px;font-weight:800;
  color:#1a1204;background:rgba(242,190,72,.85);text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
/* 11/15 🌏 해외쇼츠 탭 (08 방 한판 부탁 · 사장님 「추천대로 가자」) — 작업실 ↔ 해외쇼츠 바꾸기 단추 */
.tab{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:7px 11px;border-radius:12px;font-size:12px;font-weight:800;border:0;
  color:var(--gold2);background:rgba(12,19,48,.9);box-shadow:0 0 0 1px rgba(242,190,72,.5),0 4px 14px rgba(0,0,0,.4);font-family:inherit;cursor:pointer}
.tab:active{transform:scale(.97)}
.open.alt{margin-top:-8px;min-height:50px;font-size:16px;background:var(--navy);color:var(--gold2);box-shadow:0 0 0 1px rgba(242,190,72,.5)}
/* 11/22 🎬 첫 화면 = 숏츠 (숏츠.js) */
#os{min-height:100%;padding:14px 16px calc(70px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.os-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.os-top h2{font-size:20px;font-weight:900;color:var(--gold)}
.os-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.os-btn{border:1px solid rgba(242,190,72,.45);background:var(--navy);color:var(--gold2);border-radius:11px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.os-jump{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.os-chip{flex:none;padding:6px 11px;border-radius:999px;background:#15151a;border:1px solid #2a2a30;color:var(--text);text-decoration:none;font-size:13px;font-weight:700}
.os-ch{margin:10px 0 18px;scroll-margin-top:10px}
.os-chhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(242,190,72,.16),rgba(12,19,48,.6));border:1px solid rgba(242,190,72,.35);margin-bottom:10px}
.os-chname{font-size:18px;font-weight:900}
.os-folder{flex:none;padding:9px 13px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-weight:900;text-decoration:none;font-size:14px}
.os-card{background:#141417;border:1px solid #2a2a30;border-radius:16px;padding:13px;margin:0 0 12px}
.os-meta{display:flex;gap:6px;margin-bottom:6px}
.os-pill{font-size:12px;color:var(--muted);border:1px solid #2f2f36;border-radius:999px;padding:2px 8px}
.os-pill.ok{color:#5cc28a;border-color:#2f6b4c}
.os-title{font-size:16px;font-weight:800;line-height:1.45;margin-bottom:8px}
.os-big{display:block;text-align:center;border-radius:13px;padding:13px;font-size:16px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;text-decoration:none}
.os-sub{color:var(--muted);font-size:12.5px;margin:5px 0 8px;line-height:1.5}
.os-tabs{display:flex;gap:4px;background:#1d1d22;padding:4px;border-radius:12px;margin:6px 0 8px}
.os-tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:800;padding:8px 0;border-radius:9px;cursor:pointer}
.os-tab.on{background:#000;color:var(--text)}
.os-copy{display:block;width:100%;text-align:left;border:1px solid #2f2f36;border-radius:11px;padding:10px 11px;margin:6px 0 4px;background:#202026;color:var(--text);font:inherit;font-size:14.5px;cursor:pointer}
.os-copy b{color:var(--gold);margin-right:7px}
.os-txt{white-space:pre-wrap;word-break:break-all;font-size:13px;color:#cfcfd4;background:#0c0c0e;border-radius:9px;padding:8px 10px;max-height:7.5em;overflow:auto}
.os-msg{font-size:12.5px;color:var(--muted);min-height:1.2em;margin:2px 0}
.os-msg.ok{color:#5cc28a}
.os-done{display:block;width:100%;border:1px dashed #3a3a42;border-radius:11px;padding:10px;margin-top:8px;background:none;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.os-empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}
</style>
</head>
<body>
