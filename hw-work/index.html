<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>HW 작업실</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#000;--navy:#0c1330;--gold:#F2BE48;--gold2:#FFDE8C;--text:#f3efe6;--muted:#8f93a0;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all;
  background-image:radial-gradient(520px 420px at 50% 38%,rgba(242,190,72,.16),transparent 70%)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.logo{width:132px;height:132px;border-radius:32px;box-shadow:0 0 0 2px rgba(242,190,72,.55),0 18px 50px rgba(242,190,72,.28);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
h1{font-size:26px;font-weight:900;letter-spacing:-.03em;animation:up .5s .08s both}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:var(--muted);font-size:14px;margin-top:-14px;animation:up .5s .12s both}
.bar{width:150px;height:4px;border-radius:2px;background:rgba(242,190,72,.18);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:load 1s ease-in-out infinite}
.open{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;min-height:60px;border-radius:18px;text-decoration:none;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-weight:900;font-size:19px;box-shadow:0 10px 30px rgba(242,190,72,.3);animation:up .35s both}
.open:active{transform:scale(.98)}
.msg{color:var(--muted);font-size:13.5px;text-align:center;line-height:1.6;max-width:320px}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#work{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;opacity:0;transition:opacity .35s}
#work.on{opacity:1}
.float{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:7px 11px;border-radius:12px;font-size:12px;font-weight:800;
  color:#1a1204;background:rgba(242,190,72,.85);text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
</style>
</head>
<body>
<main>
  <img class="logo" src="icons/icon-512.png" alt="" width="132" height="132">
  <h1>HW <em>작업실</em></h1>
  <p class="sub">💎 HW 머니랩</p>
  <div class="bar" id="bar"><i></i></div>
  <a class="open" id="open" href="#" rel="noopener" hidden>🛠 작업실 열기</a>
  <p class="msg" id="msg" hidden></p>
</main>
<iframe id="work" title="HW 작업실" hidden allow="clipboard-write; clipboard-read; web-share"></iframe>
<a class="float" id="float" href="#" target="_blank" rel="noopener" hidden>↗ 새 창</a>
<script>
(function () {
  // 사장님 계정만 열리는 구글 Apps Script 주소 (iframe ✗ — 구글 로그인 쿠키 문제 · 같은 창에서 넘어감)
  var URL_ = "https://script.google.com/macros/s/AKfycbxFslbHz1l4COvjGuhgTFN7nDD9_64jwYzGZZKjnRkMrpGy9DRtbPY80h1WhdWqGCVI/exec";
  var open = document.getElementById("open"), msg = document.getElementById("msg"), bar = document.getElementById("bar");

  // ── 📲 공유 받기 (10/1 사장님 「틱톡도 · 클립도 링크 자동으로」) ──
  // 틱톡·클립 앱 「공유 → HW 작업실」 → manifest share_target 이 ./?st=제목&sx=글&su=주소 로 연다
  // → 글에서 주소만 뽑아 작업실(Apps Script)에 ?share=주소&t=제목 으로 넘긴다 → 거기서 「어느 편에 넣을까요?」
  var 좋은주소 = /^https?:\/\/(?:(?:vt|vm|www|m)\.tiktok\.com\/|[^\/]*tiktok\.com\/@[^\/]+\/video\/|naver\.me\/|(?:m\.)?clip\.naver\.com\/|(?:www\.|m\.)?youtube\.com\/shorts\/|youtu\.be\/|(?:www\.)?instagram\.com\/(?:reel|reels|p)\/|(?:m\.)?blog\.naver\.com\/)/i;
  function 주소정리(u) { return u.replace(/[.,;:!?'"\)\]}>]+$/, ""); }
  function 주소뽑기(글) {
    글 = String(글 || "");
    var 모두 = (글.match(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/g) || []).map(주소정리);
    if (!모두.length) {                                                                   // 「vt.tiktok.com/…」 처럼 https:// 없이 올 때
      var m = 글.match(/(?:^|[^A-Za-z0-9.])((?:vt\.tiktok\.com|vm\.tiktok\.com|naver\.me|clip\.naver\.com)\/[A-Za-z0-9\-._~\/?#@!$&'()*+,;=%]+)/i);
      if (m) 모두 = ["https://" + 주소정리(m[1])];
    }
    return 모두.filter(function (u) { return 좋은주소.test(u); })[0] || 모두[0] || "";
  }
  function 주소빼기(s) {
    return String(s || "").replace(/https?:\/\/\S+/g, " ").replace(/(?:vt\.tiktok\.com|vm\.tiktok\.com|naver\.me|clip\.naver\.com)\/\S*/gi, " ").replace(/\s+/g, " ").trim();
  }
  function 제목뽑기(제목, 글) {
    var 남은 = 주소빼기(글);
    제목 = 주소빼기(제목);
    var t = 제목 && 남은.indexOf(제목) < 0 ? 제목 + " " + 남은 : (남은 || 제목);
    return t.trim().slice(0, 300);
  }
  var 받은 = new URLSearchParams(location.search);
  var 공유 = 받은.has("st") || 받은.has("sx") || 받은.has("su");
  var 가는곳 = URL_;
  if (공유) {
    var 공유주소 = 주소뽑기((받은.get("su") || "") + " " + (받은.get("sx") || "") + " " + (받은.get("st") || ""));
    var 공유제목 = 제목뽑기(받은.get("st"), 받은.get("sx"));
    가는곳 = URL_ + "?share=" + encodeURIComponent(공유주소) + "&t=" + encodeURIComponent(공유제목);
    try { history.replaceState(null, "", "./?app=hwwork2"); } catch (e) {}              // 새로고침해도 다시 공유되지 않게
    window.HW공유 = { 주소: 공유주소, 제목: 공유제목, 가는곳: 가는곳 };                   // 검수용
  }
  if (!공유 && 받은.has("src")) 가는곳 = URL_ + "?src=1";                               // 10/2 📹 ./?src=1 = 「소스 찍어 보내기」 화면부터 (대표판 숏츠 메이커 메뉴에서 옴)
  open.href = 가는곳;
  function 단추(말) { bar.hidden = true; open.hidden = false; if (말) { msg.textContent = 말; msg.hidden = false; } }
  var 끊김 = navigator.onLine === false;
  if (공유 && 끊김) 단추("인터넷이 끊겨 있어요. 연결되면 아래 단추를 눌러 주세요 (공유한 주소는 그대로 들어가요).");
  else if (!공유 && /[?&]stay\b/.test(location.search)) setTimeout(단추, 500);        // ?stay = 넘어가지 않고 단추만 (꼬였을 때 · 검수용)
  else if (끊김) 단추("인터넷이 끊겨 있어요. 연결되면 아래 단추를 눌러 주세요.");
  else if (!공유 && /[?&]go\b/.test(location.search)) {                               // ?go = 예전처럼 구글 주소로 넘어가기
    setTimeout(function () { location.replace(URL_); }, 500);
    setTimeout(function () { 단추("자동으로 안 넘어가면 아래 단추를 눌러 주세요."); }, 3500);
  } else {
    // 10/1 사장님 「딱 앱까지 뜨게 · URL 도 뜨고 그러네」 → 앱 창 안에 끼워 보인다 (주소 줄·구글 「악용사례 신고」 띠 없음)
    var work = document.getElementById("work"), fl = document.getElementById("float");
    fl.href = 가는곳;
    work.onload = function () { work.classList.add("on"); setTimeout(function () { document.querySelector("main").hidden = true; }, 350); };
    setTimeout(function () { work.hidden = false; work.src = 가는곳; }, 공유 ? 150 : 500);   // 금색 로고 0.5초 → 작업실 (공유면 바로)
    setTimeout(function () { fl.hidden = false; }, 8000);                              // 안 뜨면 ↗ 새 창 (구글 로그인이 풀렸을 때 등)
  }
  // ── 📸 사진 도우미 (10/1 사장님 「블로그 사진 한 장씩 복사해서 붙여 넣기」) ──
  // 작업실은 구글 칸(iframe) 두 겹 안이라 사진 복사·공유·저장이 막힐 수 있다 → 앱(이 맨 위 창)이 대신 해 준다.
  // 작업실이 {hw:"copy"|"share"|"save", n, files:[사진]} 를 보내면 하고 나서 {hw:"done", n, ok, err} 로 답한다.
  // ★우리 iframe 안쪽 창이 보낸 것만★ · 사진(png·jpg)만 · 한 번에 30장까지 · 누른 손길은 안쪽 칸에서 이 창까지 같이 살아 있다
  function 우리칸(w) {
    var 칸 = document.getElementById("work").contentWindow;
    for (var x = w, i = 0; x && i < 8; i++) { if (x === 칸) return true; if (x === x.parent) break; x = x.parent; }
    return false;
  }
  function png로(blob) {
    if (blob.type === "image/png") return Promise.resolve(blob);
    return new Promise(function (ok, no) {
      var img = new Image(), u = URL.createObjectURL(blob);
      img.onload = function () {
        var c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext("2d").drawImage(img, 0, 0);
        URL.revokeObjectURL(u);
        c.toBlob(function (b) { if (b) ok(b); else no(new Error("png")); }, "image/png");
      };
      img.onerror = function () { URL.revokeObjectURL(u); no(new Error("img")); };
      img.src = u;
    });
  }
  var 복사되나 = !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem);
  addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object" || typeof d.hw !== "string" || !e.source || !우리칸(e.source)) return;
    var 답곳 = e.origin && e.origin !== "null" ? e.origin : "*";
    function 답(ok, err) { try { e.source.postMessage({ hw: "done", n: d.n, ok: ok, err: err || "" }, 답곳); } catch (x) {} }
    if (d.hw === "hello") { e.source.postMessage({ hw: "shell", v: 1, share: !!navigator.share, copy: 복사되나 }, 답곳); return; }
    var 사진들 = (Array.isArray(d.files) ? d.files : []).filter(function (f) {
      return f instanceof Blob && /^image\/(png|jpeg)$/.test(f.type) && f.size < 8 * 1024 * 1024;
    }).slice(0, 30);
    if (!사진들.length) return 답(false, "no-file");
    if (d.hw === "copy") {
      if (!복사되나) return 답(false, "no-copy");
      var 일;
      try { 일 = navigator.clipboard.write([new ClipboardItem({ "image/png": png로(사진들[0]) })]); }   // 약속째 넘겨야 손길이 안 식는다
      catch (x) { 일 = png로(사진들[0]).then(function (b) { return navigator.clipboard.write([new ClipboardItem({ "image/png": b })]); }); }
      일.then(function () { 답(true); }, function (x) { 답(false, (x && x.name) || "err"); });
    } else if (d.hw === "share") {
      var 짐 = { files: 사진들 };
      if (!navigator.share || (navigator.canShare && !navigator.canShare(짐))) return 답(false, "no-share");
      navigator.share(짐).then(function () { 답(true); }, function (x) { 답(false, (x && x.name) || "err"); });
    } else if (d.hw === "save") {
      사진들.forEach(function (f, i) {                    // 번호 순서대로 → 폰 「Download」 (갤러리·블로그 사진 고르기에 보임)
        setTimeout(function () {
          var a = document.createElement("a"), u = URL.createObjectURL(f);
          a.href = u; a.download = f.name || ("사진" + (i + 1) + (f.type === "image/png" ? ".png" : ".jpg"));
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
        }, i * 400);
      });
      답(true);
    }
  });

  addEventListener("pageshow", function (e) { if (e.persisted) 단추(); });               // 뒤로 가기로 돌아오면 다시 안 튕기고 단추만
  addEventListener("online", function () { msg.hidden = true; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
